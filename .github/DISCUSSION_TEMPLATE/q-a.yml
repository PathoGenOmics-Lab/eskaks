labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions about how to run eskaks, or about why a dN/dS or pN/pS came
        out the way it did, belong here rather than in the issue tracker. An
        answer here can be marked as the answer, which is what makes the next
        person find it.

        Two things worth checking first, because they account for most questions:

        - A `NaN` in a dN/dS column is usually saturation, not a failure. Above
          the point where the correction formula breaks down (p >= 0.749 for
          Nei-Gojobori, a non-positive denominator for Li) the pair is too
          divergent for a nucleotide-level estimate, and `NaN` is the honest
          answer rather than a number that would look usable.
        - A `vcf` run that comes out empty or all `NA` is almost always a name
          mismatch. The contig name in the VCF, the sequence name in the
          reference FASTA and the first column of the GFF3 have to be the same
          string. Rerunning with `-v` prints what could not be reconciled.

        If the tool crashed or refused to run, that is a
        [bug report](https://github.com/PathoGenOmics-Lab/eskaks/issues/new/choose)
        instead.

  - type: input
    attributes:
      label: Version
      description: >-
        The output of `eskaks --version`. If you built from source, the commit
        hash instead, since there is no published release yet and "main" moves.
      placeholder: eskaks 0.1.0
    validations:
      required: true

  - type: textarea
    attributes:
      label: What are you trying to find out
      description: >-
        The analysis behind the question, not only the symptom. Knowing what
        answer you are after usually changes what the answer should be. Whether
        you are after selection on one gene, a genome-wide scan or a comparison
        against another tool matters more here than it looks.
    validations:
      required: true

  - type: textarea
    attributes:
      label: The command you ran
      description: >-
        The whole command, subcommand and every flag. `--model`, `--genetic-code`
        and `--kappa` change the numbers, so a command with the flags trimmed off
        is a different question from the one you are asking.
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: What you got, and what you expected instead
      description: >-
        Paste the rows in question if you can, tabs and all. A question about a
        dN/dS value can rarely be settled from a description of it.
    validations:
      required: true

  - type: textarea
    attributes:
      label: The records, if the question is about specific sequences or a specific gene
      description: >-
        For `fasta`, the two aligned sequences the pair came from. For `vcf`, the
        VCF line or lines and the GFF3 line for the gene or CDS that covers them,
        tabs and all. Optional, because plenty of questions here are not about
        one gene. But when yours is, this is the difference between an answer and
        a conversation: a rate estimate can almost never be judged from a
        description of it, and with these it can usually be reproduced in one run.
      render: text
      placeholder: |
        >seq_A
        ATGACCGATTTAGCA
        >seq_B
        ATGACGGATCTAGCA

        NC_000962.3	761155	.	C	T	.	PASS	.
        NC_000962.3	RefSeq	CDS	761140	762000	.	+	0	ID=cds-x;Name=rpoB

  - type: textarea
    attributes:
      label: Where your inputs came from
      description: >-
        For `fasta`, what produced the codon alignment and whether it is in frame
        from the first base. For `vcf`, the variant caller, the source of the
        reference and of the annotation. The genetic code table too: the default
        is 1 (Standard), which is the wrong table for a bacterium, where you
        want 11.
      placeholder: |
        Mode: vcf
        VCF: single sample, called against NC_000962.3
        FASTA: NC_000962.3 from NCBI
        Annotation: GFF3 from the same assembly
        Genetic code: 11 (bacterial)
        Model: default (Nei-Gojobori)
    validations:
      required: true
