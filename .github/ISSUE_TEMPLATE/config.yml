# Blank issues stay available. The forms cover the reports that arrive most
# often, but a small tool gets questions that fit no form, and having nowhere to
# put them is worse than an unstructured issue.
blank_issues_enabled: true

# The documentation links below point into the repository rather than at
# https://pathogenomics-lab.github.io/eskaks/ on purpose. The MkDocs site is
# built and checked in CI, but GitHub Pages is not enabled for this repository
# yet, so that address currently serves a 404. A dead link on the issue chooser
# is worse than a plain one: it is the first thing a confused user clicks, and
# it teaches them that the docs do not exist. GitHub renders Markdown in the
# repository view well enough to read, so these work today. When Pages is
# switched on, swap both URLs over to the site and drop this comment.
contact_links:
  - name: Ask a question
    url: https://github.com/PathoGenOmics-Lab/eskaks/discussions/categories/q-a
    about: >-
      Questions about how to run it, about which mode to use, or about why a
      gene came out the way it did. Answers there get marked as answers, so the
      next person finds them.
  - name: Documentation
    url: https://github.com/PathoGenOmics-Lab/eskaks/tree/main/docs
    about: >-
      The tutorial, the CLI reference, the models, the output formats, and the
      glossary. These are the sources for the MkDocs site, readable as they are
      until Pages is enabled.
  - name: Frequently asked questions
    url: https://github.com/PathoGenOmics-Lab/eskaks/blob/main/docs/faq.md
    about: >-
      Worth a look first, particularly for empty or all-NA vcf output, for NaN
      values, and for internal stop codons. Each of those is usually the correct
      answer to the input rather than a defect.
  - name: Report a security vulnerability
    url: https://github.com/PathoGenOmics-Lab/eskaks/security/advisories/new
    about: Please report vulnerabilities privately rather than in a public issue.
