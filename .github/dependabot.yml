# Dependency updates.
#
# The failure mode this file exists to avoid is not the updates themselves, it
# is their shape: with no configuration at all Dependabot opens one pull request
# per dependency, and the majors, the ones that actually change APIs, arrive
# mixed in with a swarm of patch bumps that nobody wants to read one at a time.
# Every such batch ends the same way, closed unread. So the updates are kept and
# the noise is dropped:
#
#   * grouped, so a whole ecosystem's routine bumps land as one pull request
#   * majors kept apart, in their own single pull request per ecosystem, because
#     those are the ones that want a person to look at them
#   * small per-ecosystem limits, so an unreviewed week cannot pile up
#
# `schedule` below is Dependabot's own timer, not a cron trigger in GitHub
# Actions: no workflow in this repository runs on a schedule except the stale
# sweep, which has nothing but time to hang off. Weekly is safe here precisely
# because of the grouping: a week's worth of routine bumps is one pull request,
# not seven, and holding them for a month only makes that one pull request older
# and harder to bisect when it breaks.
#
# All three entries are set to the same day on purpose, so the week's dependency
# work is one sitting rather than something that trickles in.
#
# Security updates are a separate mechanism, enabled in the repository settings,
# and are unaffected by any of this: a vulnerable dependency still gets its own
# pull request the day the advisory lands, grouped or not, major or not.
#
# On labels: a label named here is silently ignored unless it already exists in
# the repository, and eskaks currently carries only GitHub's default label set.
# `dependencies` is the one Dependabot creates for itself, so it is the only one
# these entries ask for. The ecosystem is carried by the commit-message prefix
# instead, which needs nothing to exist beforehand. If per-ecosystem labels are
# ever created (`rust`, `github-actions`, `fuzzing`), add them back here.
#
# Two ecosystems that a reader might expect are deliberately absent:
#
#   * npm. eskaks has no JavaScript package manager. The interactive HTML report
#     is generated by the Rust code with hand-written JavaScript inlined into it,
#     so the report is self-contained and there is no lockfile to bump.
#   * pip. The documentation is MkDocs Material, but .github/workflows/docs.yml
#     installs it with a literal `pip install "mkdocs-material[imaging]"` line
#     and there is no docs/requirements.txt. Dependabot updates manifests, not
#     shell commands, so a pip entry here would find nothing to track. Adding a
#     requirements file first is the way to change that, not adding an entry.

version: 2

updates:
  # The crate: one package, one Cargo.toml, one Cargo.lock at the root.
  #
  # The limit is 3 rather than 2 because the two groups below do not always
  # cover everything: an update Dependabot cannot fit into a group, because the
  # group as a whole does not resolve, still comes through on its own, and once
  # the limit is reached the routine group silently stops being refreshed.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "cargo"
    groups:
      cargo-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]

  # The fuzz crate, which is worth updating precisely because it is separate.
  #
  # fuzz/Cargo.toml declares an empty `[workspace]` so that a plain `cargo test`
  # at the root never drags the nightly-only sanitizer dependencies into a normal
  # build. The cost of that isolation is a second Cargo.lock which resolves
  # independently, and that independence has already broken this repository once:
  # indicatif's old version range let cargo pick a console release that moved
  # Style/Term behind a feature, and the fuzz workspace was where it failed to
  # compile, because it had resolved a different set of versions than the root
  # lockfile had frozen. The root pin in Cargo.toml fixed that particular case;
  # this entry is what keeps the second lockfile from drifting quietly again
  # between fuzzing runs, which are workflow_dispatch only and therefore may be
  # months apart.
  #
  # A single group for everything, no major/minor split: nothing here ships to a
  # user, the crate exists to be built with a nightly toolchain and thrown at
  # libFuzzer, so a major bump of libfuzzer-sys or tempfile is judged by whether
  # `cargo fuzz run` still starts.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "fuzz"
    groups:
      fuzz-deps:
        patterns: ["*"]

  # The actions the workflows themselves pin. These go stale silently, which is
  # the whole argument for tracking them: a deprecated runner image or a Node
  # version dropped from an action is only noticed when a job starts warning, or
  # when it fails on a Friday. The pins in .github/workflows are already uneven,
  # actions/checkout appears at more than one major across the files here, and
  # nothing but this entry will point that out.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels: ["dependencies"]
    commit-message:
      prefix: "actions"
    groups:
      actions-routine:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
