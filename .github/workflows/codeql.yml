name: CodeQL

# Static analysis over everything this repository is written in. Nothing here
# looked at the code this way before: clippy checks the shape of a line, and the
# 700 tests check the answer, while these queries follow a value across
# functions and files and ask where an unchecked one arrives somewhere it
# matters.
#
# Four languages, which is all of them. eskaks is a single Rust crate, but the
# crate is not the only code in the tree:
#
#   rust                   the dN/dS and pN/pS engine, the largest part by far
#   javascript-typescript  the two browser scripts under src/report/
#   python                 the scripts under benchmarks/
#   actions                the workflows themselves, including this one
#
# The javascript entry is the one worth defending, because there is no npm here,
# no bundler, no TypeScript, no package-lock.json and no frontend build of any
# kind. What there is: src/report/script.js and src/report/fasta_script.js, two
# hand-written browser scripts that get embedded verbatim into the
# self-contained HTML report and that build the DOM out of values which arrived
# from somebody's input files, sequence headers from a FASTA, gene and contig
# identifiers from a GFF3 or a VCF. Those strings are attacker-influenced in any
# workflow where the alignment came from outside the lab, and the question of
# whether one of them can reach an innerHTML is a taint question. That is
# exactly what these queries answer and exactly what nothing else in the project
# asks, so the language stays.
#
# python is not a stretch either. Two of the benchmark scripts shell out to
# other tools through subprocess, which is the shape of code the command
# injection queries were written for.
#
# actions is not a curiosity. These queries know about script injection through
# untrusted context values, the classic being an expression interpolated
# straight into a `run:` block, and about tokens handed more permission than the
# job needs. Reasoning that a workflow is safe is exactly the kind of reasoning
# worth having checked by something that is not the person who wrote it.
#
# On pushes to main and on pull requests, with no schedule. GitHub's own default
# CodeQL setup adds a weekly cron; this does not, in keeping with the rest of
# the automation here. The one scheduled job anywhere in this repository is the
# stale-issue sweep, which has nothing to hang off except time. Everything else,
# this included, hangs off the event that made the answer go stale, which for
# static analysis is a change to the source.
#
# `build-mode: none` reads the source without compiling it. It is what makes
# this take a minute rather than a full release build, and it is the documented
# mode for interpreted languages and for the compiled ones that support it. It
# also means the rust row needs no toolchain, no cargo cache and no lockfile
# resolution to say something useful.

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an older analysis irrelevant, the same as CI.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Inline rather than a separate config file, because two exclusions do
          # not deserve their own file in .github/.
          #
          # docs/javascripts/mathjax/ is a vendored, minified third-party
          # release of MathJax, over a megabyte on one line. Handing that to the
          # javascript extractor costs most of the runtime of this job and
          # returns alerts about code nobody here wrote and nobody here can
          # patch; the fix for anything found in it is a version bump upstream,
          # not a change in this repository.
          #
          # docs/assets/example-report.html is a generated report checked in so
          # the documentation can link to a real one. Its inline script is a
          # copy of src/report/script.js, so scanning it means every finding
          # gets reported twice, once at the source we can fix and once at a
          # build output that is regenerated by the tool. The source copy is the
          # one worth looking at.
          config: |
            paths-ignore:
              - docs/javascripts/mathjax
              - docs/assets/example-report.html

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
