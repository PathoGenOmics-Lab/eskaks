name: Dependabot auto-merge

# Merges Dependabot's routine updates once CI has passed, and never touches a
# major one.
#
# The point of the split is that a minor or patch bump that survives the whole
# suite (clippy with warnings denied on all targets, the roughly 700 tests that
# `cargo test` runs on Linux and macOS, which include the golden-output snapshot
# in tests/golden.rs, the proptest property tests and the docs-code contract
# test, the release build, and the strict MkDocs build when the pull request
# touches the docs) has already been examined more carefully than a person would
# examine it by eye, while a major bump changes APIs and wants a person to look.
#
# What actually holds the merge back is branch protection: `--auto` queues the
# merge and GitHub only performs it once the required checks are green, so the
# list of required checks is the real gate and this file only decides which pull
# requests are allowed to join the queue at all.
#
# Triggered by the pull request itself, not by a schedule.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Merge routine updates once CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Read what this pull request updates
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The rule, decided once.
      #
      # The obvious shape is to write it twice, once on the merge step and once
      # negated on the step that explains itself, and those two halves drift the
      # moment either one is edited: a pull request that matches both would be
      # merged and told it had not been. One step decides, the other two read
      # the answer.
      #
      # Named rather than excluded: merge when the pull request says in so many
      # words that it is a patch or a minor, or when it is a `-routine` group,
      # which the configuration already restricts to those two.
      #
      # Asking instead whether the update was "not major" is a different and
      # weaker test. An update that reports no update type at all yields an
      # empty string, and an empty string is not equal to major, so that
      # phrasing says yes to everything it failed to classify. Anything this
      # cannot positively identify still waits for a person.
      #
      # The update-type test applies to grouped pull requests too, not only to
      # ungrouped ones. A group reports "the highest semver change being made by
      # this PR", so a group carrying one major is a major here. That is what
      # lets the groups in dependabot.yml hold patches and majors alike without
      # a major slipping through on the back of a patch.
      - name: Decide whether this one may merge itself
        id: decide
        env:
          GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          may_merge=false
          case "$GROUP" in
            *-routine) may_merge=true ;;
          esac
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor) may_merge=true ;;
          esac
          # Printed because a decision nobody can read is a decision nobody can
          # correct: this line is what a later surprise gets diagnosed from.
          echo "group='${GROUP}' update-type='${UPDATE_TYPE}' -> may-merge=${may_merge}"
          echo "may-merge=${may_merge}" >> "$GITHUB_OUTPUT"

      # --squash, matching every other merge into main. The repository allows no
      # other method, so --merge here would not be a stylistic difference, it
      # would be a queued merge that GitHub refuses.
      - name: Queue the merge
        if: steps.decide.outputs.may-merge == 'true'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Say why this one was left alone
        if: steps.decide.outputs.may-merge != 'true'
        run: |
          gh pr comment "$PR_URL" --body \
            "Left for review. Only a \`-routine\` group, or an update that identifies itself as patch or minor, merges on its own once CI passes. This one is a major update or does not say which it is."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
