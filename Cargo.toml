[package]
name = "eskaks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Paula Ruiz-Rodriguez", "Mireia Coscolla"]
description = "Fast pairwise dN/dS and per-gene pN/pS for molecular-evolution and Mycobacterium tuberculosis selection analysis"
repository = "https://github.com/PathoGenOmics-Lab/eskaks"
homepage = "https://pathogenomics-lab.github.io/eskaks/"
documentation = "https://pathogenomics-lab.github.io/eskaks/"
readme = "README.md"
license = "GPL-3.0-only"
keywords = ["dnds", "pnps", "bioinformatics", "molecular-evolution", "genomics"]
categories = ["command-line-utilities", "science"]

[dependencies]

needletail = "0.7"
# gzip/bgzip decompression for the VCF/GFF/reference readers (needletail already
# decompresses FASTA transparently). flate2 is pulled in via needletail anyway.
flate2 = "1"

env_logger = "0.11"
rayon = "1.5"
crossbeam = "0.8"
# 0.17 bounds `console` to 0.15. indicatif 0.16 declared `console = ">=0.9.1, <1.0.0"`
# with default-features off, so cargo was free to pick console 0.16, which moved
# Style/Term/measure_text_width behind its `std` feature and then failed to compile. That
# broke the fuzz workspace and would have broken the main build on the next `cargo update`.
indicatif = { version = "0.18", features = ["rayon"] }
log = "0.4"
rustc-hash = "2.1.3" 
clap = { version = "4.5.4", features = ["derive"] }
clap_complete = "4.5"
anyhow = "1.0.102"

[profile.release]
opt-level      = 3
lto            = "fat"
codegen-units  = 1
panic          = "abort"
strip          = true

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"
flate2 = "1"
