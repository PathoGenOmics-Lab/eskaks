<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The emblem is the wordmark reduced to its two chess pieces: the red king that
  stands in for the a of esKaKs and the blue knight that stands in for its
  final s. Both are always present, because one piece alone no longer says
  which mark this is.

  Nothing here is redrawn. Every path is the byte-for-byte d of logo.svg and
  still sits under the wordmark's own
  matrix(1.3212712,0,0,1.3212712,-83.744634,-328.30133), so the emblem and the
  wordmark are one drawing. The only thing added is an outer translate per
  piece, which deletes the two hundred units of lettering that separate them in
  the wordmark and nests the knight into the space above the king's shoulder.

  That nesting is the whole point. Set side by side on a shared baseline the
  pair measures 174.8 x 137, so a square around it wastes a fifth of its height
  and the pieces shrink to 78 per cent of it. Lifting the knight by 34.7 units
  and pulling it 217.56 units left slots its base into the gap over the king's
  right arm: the pair then measures 156.49 x 156.52, square to within three
  hundredths of a unit, and every piece is 11.7 per cent larger on the same
  canvas. The margin is 3.75 units a side, 2.3 per cent, which is the least
  that keeps ink off the edge. Artwork fills 95.4 per cent of both axes, and
  the king alone stands 83.1 per cent of the square tall.

  The two shapes never touch. Their closest approach is 7.9 units, 5.0 per cent
  of the square, which is the channel that keeps them legible as two pieces
  rather than one blob when the square is 16 px wide.

  #e05252 is the red of logo-dark.svg, not the #892121 of the light wordmark,
  because one file has to serve the #305595 masthead, the #1d2026 slate canvas,
  a white browser tab and the #f9f9f7 docs ground, and #892121 is all but
  invisible on the dark two. Neither brand blue can hold up its half of that
  set: #00229e runs 12.19 to 1 on a white tab but 1.34 on slate, and #708fff
  runs 5.49 on slate but 2.97 on white and 2.82 on the docs ground, so it fails
  the light half the red clears. #5c7bee is the blue used here. It lies on the
  straight line between the two brand blues, at their hue (227.3 degrees,
  against 227.1 and 227.0) and at the red's own relative luminance (0.2261
  against 0.2249). Measured against the four grounds it runs 1.93, 4.29, 3.80
  and 3.61 to 1, against the red's 1.92, 4.27, 3.82 and 3.62, so the pieces
  clear 3 to 1 on the same three grounds and fade together on the fourth rather
  than one going before the other. On the masthead nothing clears 3 to 1: that
  needs a relative luminance above 0.379 and no red or blue still recognisable
  as this brand's is that light, so hue is what carries the mark there. Holding
  the two luminances equal costs the one thing it buys everywhere else, since
  red and blue are now 1.005 to 1 apart from each other: where the pieces come
  closest they are told apart by hue and by the channel between them, never by
  lightness. Every path states its fill, so nothing falls back to black and no
  dark twin of this file is needed.
-->
