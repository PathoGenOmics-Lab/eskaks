<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  The masthead already sets the site name in type, and the wordmark is 2:1, so
  up there it repeats what the type says and a browser drawing it into a 16px
  tab gets an illegible smear. This is the chess king that stands in for the a
  of esKa/Ks, kept at its original coordinates under the wordmark's own
  transform, so the emblem and the wordmark are the same drawing rather than a
  redrawing of it. The viewBox is the square centred on the piece.

  #e05252 is the red of logo-dark.svg, not the #892121 of the light wordmark,
  because this single file has to serve every ground the mark lands on: it
  clears 3:1 against a white tab, a dark tab, the #f9f9f7 docs canvas and the
  #0d0d0d one, which #892121 does not. On the #305595 masthead no red clears
  3:1 at all, since that blue sits at the same luminance as any red still
  recognisable as the brand's; hue separation is what carries the mark there.
  Every path states its fill, so nothing falls back to black and no dark twin
  of this file is needed.
-->
