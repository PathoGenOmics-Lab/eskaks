<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eskaks report</title>
<style>
/* Palette: PathoGenOmics-Lab mycolorsTB (pathogenomics brand + M. tuberculosis lineage colors). */
:root{color-scheme:light;--bg:#f9f9f7;--surface:#fcfcfb;--fg:#0b0b0b;--muted:#7d746c;
--card:#fcfcfb;--border:#e3ddd6;--grid:#e3ddd6;--axis:#c0b3a7;
--accent:#305595;--pos:#c01718;--sig:#c01718;--ns:#c0b3a7;--line:#3c5824;--sel:#d1ae00;
--s1:#ff3091;--s2:#001aff;--s3:#8a0bd2;--s4:#ff0000;--s5:#995200;--s6:#1eb040;--s7:#ff9d00;--s8:#73c2ff;
/* Elevation scale — soft warm-tinted drop shadows in light. */
--shadow-1:0 1px 2px rgba(40,33,25,.05),0 2px 6px rgba(40,33,25,.06);
--shadow-2:0 2px 6px rgba(40,33,25,.06),0 10px 24px rgba(40,33,25,.10);
--shadow-3:0 12px 32px rgba(40,33,25,.16);}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
--bg:#0d0d0d;--surface:#1a1a19;--fg:#ffffff;--muted:#a89f96;--card:#1d2026;--border:#2c2c2a;--grid:#2c2c2a;--axis:#3a3a37;
--accent:#9ec4e8;--pos:#e35b5c;--sig:#e35b5c;--ns:#7d746c;--line:#7fa860;--sel:#d1ae00;
/* A black shadow vanishes on #0d0d0d, so pair a stronger drop with a 1px inset top-highlight (a lifted bevel). */
--shadow-1:0 1px 2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.04);
--shadow-2:0 4px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
--shadow-3:0 14px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d0d0d;--surface:#1a1a19;--fg:#ffffff;--muted:#a89f96;
--card:#1d2026;--border:#2c2c2a;--grid:#2c2c2a;--axis:#3a3a37;
--accent:#9ec4e8;--pos:#e35b5c;--sig:#e35b5c;--ns:#7d746c;--line:#7fa860;--sel:#d1ae00;
--shadow-1:0 1px 2px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.04);
--shadow-2:0 4px 14px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
--shadow-3:0 14px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);}
/* Colour-blind–safe (Okabe-Ito) palette, opt-in via the CVD toggle. Validated with
   the dataviz palette checker (adjacent-pair CVD ΔE ≥ 17); paired with shape coding. */
:root[data-cvd]{--accent:#0072B2;--pos:#D55E00;--sig:#D55E00;--ns:#999999;--line:#117733;--sel:#E69F00;
--s1:#0072B2;--s2:#D55E00;--s3:#CC79A7;--s4:#009E73;--s5:#E69F00;--s6:#56B4E9;--s7:#F0E442;--s8:#117733;}
:root[data-cvd][data-theme="dark"]{--ns:#8a8f98;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
background:var(--bg);color:var(--fg);line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:24px}
.layout{display:flex;gap:20px;align-items:flex-start}
.main{flex:1;min-width:0}
.toc{position:sticky;top:16px;flex:0 0 196px;max-height:calc(100vh - 32px);overflow:auto;
border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:10px 6px;box-shadow:var(--shadow-1)}
.toc .toc-h{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:2px 8px 6px}
.toc a{display:block;padding:4px 8px;font-size:.8rem;line-height:1.3;color:var(--muted);text-decoration:none;
border-left:2px solid transparent;border-radius:0 5px 5px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
transition:color 120ms ease,background-color 120ms ease,border-left-color 120ms ease}
.toc a:hover{color:var(--fg);background:color-mix(in srgb,var(--accent) 7%,transparent);border-left-color:var(--axis)}
.toc a.active{color:var(--accent);border-left-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));font-weight:600}
@media (max-width:900px){.toc{display:none}.layout{display:block}}
@media print{.toc{display:none}.layout{display:block}}
h1{font-size:1.5rem;font-weight:700;line-height:1.2;letter-spacing:-.012em;margin:0 0 4px}
.brand{display:flex;align-items:center;gap:14px;margin:0 0 4px}
.brand h1{margin:0}
.brand .ver{color:var(--accent);font-size:.78rem;font-weight:600;background:color-mix(in srgb,var(--accent) 10%,transparent);
border:1px solid color-mix(in srgb,var(--accent) 35%,var(--border));border-radius:999px;padding:1px 9px;align-self:center}
.brand .gh{display:inline-flex;align-items:center;gap:5px;margin-left:auto;color:var(--muted);font-size:.85rem;text-decoration:none;align-self:center;border:1px solid var(--border);border-radius:8px;padding:3px 10px}
.brand .gh:hover{color:var(--accent);border-color:var(--accent)}
/* The wordmark ships as two cuts, one per ground, and the report picks. An <img>-embedded
   SVG is its own document: it cannot see this document's data-theme, so the choice has to be
   made out here. Two <img> with one hidden beats a background-image swap because the SVG
   keeps its intrinsic aspect ratio (no hard-coded width) and the alt text survives; only one
   is ever in the accessibility tree, since display:none removes the other. The three blocks
   mirror the custom properties above, for the same reason: the media query serves readers who
   never touch the toggle, the data-theme attribute serves readers who do, and :where() keeps
   an explicit data-theme="light" from being overruled by a dark system preference. */
.brand-logo{height:52px;width:auto;display:block}
.brand-logo.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .brand-logo.logo-light{display:none}
:root:where(:not([data-theme="light"])) .brand-logo.logo-dark{display:block}}
:root[data-theme="dark"] .brand-logo.logo-light{display:none}
:root[data-theme="dark"] .brand-logo.logo-dark{display:block}
.sub{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;box-shadow:var(--shadow-1);
transition:box-shadow 140ms ease,border-color 140ms ease}
.card:hover{box-shadow:var(--shadow-2);border-color:var(--axis)}
.card .k{color:var(--muted);font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;line-height:1.3}
.card .v{font-size:1.3rem;font-weight:650;margin-top:4px;line-height:1.15;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card .v.small{font-size:.98rem}
/* Hero: the pooled ratio is the headline number — it out-ranks the utility cards.
   The vcf report hooks it via the card_gw help key (no JS change); the fasta report
   tags its "Pooled dN/dS" card with .hero directly. Both share this treatment. */
.card:has([data-help="card_gw"]),.card.hero{border-color:color-mix(in srgb,var(--accent) 32%,var(--border));
background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 6%,var(--card)),var(--card));box-shadow:var(--shadow-2)}
.card:has([data-help="card_gw"]) .k,.card.hero .k{color:var(--accent)}
.card:has([data-help="card_gw"]) .v.small,.card.hero .v{font-size:1.5rem;font-weight:700;color:var(--accent)}
.card:has([data-help="card_gw"]):hover,.card.hero:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));box-shadow:var(--shadow-3)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:20px;margin-bottom:24px}
section{margin-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow-1)}
.panel.wide{grid-column:1 / -1}
h2{font-size:1rem;font-weight:650;letter-spacing:-.006em;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border);
display:flex;align-items:center;gap:8px}
h2 .htitle{display:inline-flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
button.tog,button.btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);color:var(--fg);
padding:6px 11px;border-radius:8px;cursor:pointer;font-size:.83rem;
transition:border-color 140ms ease,background-color 140ms ease,color 140ms ease,transform 90ms ease}
button.tog.on,button.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.btn:hover,button.tog:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
button.btn:active,button.tog:active{transform:translateY(1px)}
/* Keep an ON toggle solid on hover (just deepen it) instead of washing it out. */
button.tog.on:hover,button.btn.on:hover{background:color-mix(in srgb,var(--accent) 85%,#000);border-color:var(--accent)}
/* Keyboard focus ring — shows for keyboard nav only, never on mouse (pure upside). */
button.tog:focus-visible,button.btn:focus-visible,.chip.regime:focus-visible,.cand:focus-visible,.info:focus-visible,
.brand .gh:focus-visible,details.methods summary:focus-visible,.guide summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toc a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=search]:focus{border-color:var(--accent)}
/* Inline SVG icons (Lucide, MIT) — one consistent stroke set, inherits the theme colour. */
.ic{width:15px;height:15px;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
input[type=search]{flex:1;min-width:180px;padding:7px 10px;border:1px solid var(--border);
border-radius:8px;background:var(--surface);color:var(--fg);font-size:.9rem}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
svg{max-width:100%;height:auto;display:block}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);
padding:6px 9px;border-radius:6px;font-size:.78rem;opacity:0;transition:opacity .08s;z-index:20;white-space:nowrap;box-shadow:var(--shadow-2)}
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;max-height:560px;box-shadow:var(--shadow-1)}
table{border-collapse:collapse;width:100%;font-size:.82rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
thead th{position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none;border-bottom:1px solid var(--border)}
thead th:hover{color:var(--accent)}
thead th.sorted::after{content:" ▲";font-size:.7em}
thead th.sorted.desc::after{content:" ▼"}
tbody tr.zebra{background:var(--card)}
tbody tr.sig td{font-weight:600}
tbody tr.sel{outline:2px solid var(--sel);outline-offset:-2px}
tbody tr{cursor:pointer}
.badge{display:inline-block;font-size:.62rem;padding:1px 5px;border-radius:5px;background:var(--pos);color:#fff;margin-left:4px}
.mbar{display:inline-flex;height:9px;width:70px;border-radius:3px;overflow:hidden;vertical-align:middle;border:1px solid var(--border)}
.count{color:var(--muted);font-size:.8rem;margin-left:auto;font-variant-numeric:tabular-nums}
details.methods{margin:8px 0 20px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
details.methods summary{cursor:pointer;padding:10px 14px;font-weight:600}
details.methods .body{padding:0 14px 12px;font-size:.82rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.prov{flex-basis:100%;margin-top:8px;border-top:1px dashed var(--border);padding-top:8px;line-height:1.7}
.prov code{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:.92em;word-break:break-all}
.chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3px 10px}
.census{display:flex;gap:8px;flex-wrap:wrap}
.chip.regime{cursor:pointer;color:var(--fg);display:inline-flex;align-items:center;gap:6px;font-size:.82rem;
transition:border-color 130ms ease,background-color 130ms ease,color 130ms ease}
.chip.regime i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chip.regime:hover{border-color:var(--accent)}
/* Active filter reads as a pill tinted in its own regime colour (not today's invisible surface→card swap). */
.chip.regime.on{border-color:var(--accent);background:var(--card);font-weight:600}
.chip.regime[data-regime=""].on,.chip.regime[data-regime="purifying"].on{background:color-mix(in srgb,var(--accent) 13%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.chip.regime[data-regime="positive"].on{background:color-mix(in srgb,var(--pos) 13%,var(--surface));border-color:color-mix(in srgb,var(--pos) 45%,var(--border))}
.chip.regime[data-regime="ns"].on{background:color-mix(in srgb,var(--ns) 16%,var(--surface));border-color:color-mix(in srgb,var(--ns) 50%,var(--border))}
.chip.regime b{font-variant-numeric:tabular-nums}
.candlist{margin-top:8px;font-size:.82rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cand{cursor:pointer;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:2px 7px;
transition:border-color 130ms ease,background-color 130ms ease}
.cand:hover{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 10%,var(--card))}
.cand small{color:var(--muted)}
footer{color:var(--muted);font-size:.75rem;margin-top:24px;text-align:center}
.muted{color:var(--muted);font-size:.85rem}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
circle.mark,rect.mark,path.mark{cursor:pointer}
/* ── "i" interpretation help ────────────────────────────────────── */
.info{width:19px;height:19px;min-width:19px;border-radius:50%;border:1px solid var(--border);
background:var(--card);color:var(--muted);font:italic 700 .72rem/1 Georgia,serif;cursor:pointer;
display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.info:hover,.info.on{border-color:var(--accent);color:var(--accent)}
.card .info{width:16px;height:16px;min-width:16px;vertical-align:middle;margin-left:5px}
.info-pop{position:fixed;z-index:40;max-width:340px;background:var(--card);border:1px solid var(--border);
border-radius:10px;padding:12px 14px;box-shadow:var(--shadow-3);font-size:.8rem;color:var(--fg);line-height:1.45}
.info-pop h4{margin:0 0 5px;font-size:.85rem;color:var(--accent)}
.info-pop .lead{margin:0 0 8px}
.info-pop .ax{color:var(--muted);font-size:.75rem;margin:2px 0}
.info-pop .ax b{color:var(--fg);font-style:normal}
.info-pop ul{margin:7px 0 0;padding-left:16px}
.info-pop li{margin:3px 0}
.info-pop .warn{margin-top:9px;color:var(--muted);font-size:.75rem;border-top:1px dashed var(--border);padding-top:7px}
.info-pop .warn b{color:var(--sel);font-style:normal}
.guide{margin:8px 0 20px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.guide summary{cursor:pointer;padding:10px 14px;font-weight:600}
.guide .gbody{padding:0 14px 14px;font-size:.83rem;line-height:1.5}
.guide .gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 20px;margin-top:6px}
.guide .gloss div{color:var(--muted)}
.guide .gloss b{color:var(--fg)}
/* Hero banner: the single most important line. --vc (set by renderVerdict) is the regime colour
   — blue purifying / red diversifying / grey n.s. — driving the accent edge + faint wash. */
.verdict{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-radius:10px;margin-bottom:20px;
border:1px solid var(--border);border-left:3px solid var(--vc,var(--accent));background:var(--card);
background:linear-gradient(90deg,color-mix(in srgb,var(--vc,var(--accent)) 7%,var(--card)),var(--card) 60%);box-shadow:var(--shadow-2)}
.verdict .vlab{font-size:1.2rem;font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums}
.verdict .vsub{color:var(--muted);font-size:.85rem;margin-top:2px}
.verdict .dot{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 15%,transparent)}
/* Respect a user's reduced-motion preference: keep state changes, drop the movement. */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
button.btn:active,button.tog:active{transform:none!important}}
@media print{.topbar,.info,.guide summary::marker{display:none!important}.panel,.verdict{break-inside:avoid}
.grid{display:block}.panel{margin-bottom:16px}.guide[open] summary{display:none}
/* Shadows waste ink on paper. The hero card (:has, 0,2,0) and the dot halo (.verdict .dot, 0,2,0)
   need their own specificity here or they out-rank a bare .card/.dot reset and bleed onto the page. */
.panel,.card,.card:has([data-help="card_gw"]),.card.hero,.toc,.tablewrap,.verdict,.verdict .dot,.tip,.info-pop{box-shadow:none}}
</style>
</head>

    +(h.x?'<div class="ax"><b>x</b> — '+h.x+'</div>':'')
    +(h.y?'<div class="ax"><b>y</b> — '+h.y+'</div>':'')
    +((h.read&&h.read.length)?'<ul>'+h.read.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ul>':'')
    +((h.watch&&h.watch.length)?'<div class="warn"><b>Watch out</b> — '+h.watch.join(' · ')+'</div>':'');
}
const infoBtn = key => (HELP[key]?`<button class="info" data-help="${key}" title="What is this?" aria-label="What is this?">i</button>`:"");
const infopop=$("#infopop"); let openInfo=null;
function positionPop(btn){
  const r=btn.getBoundingClientRect(), pw=infopop.offsetWidth, ph=infopop.offsetHeight, m=8;
  const left=Math.max(m, Math.min(r.left, window.innerWidth-pw-m));
  let top=r.bottom+6; if(top+ph>window.innerHeight-m) top=r.top-ph-6;   // flip above if it would overflow below
  top=Math.max(m, Math.min(top, window.innerHeight-ph-m));               // clamp fully into the viewport
  infopop.style.left=left+'px'; infopop.style.top=top+'px';
}
function showInfo(btn){ const h=HELP[btn.dataset.help]; if(!h||!infopop) return;
  infopop.innerHTML=helpHtml(h); infopop.hidden=false; positionPop(btn);
  btn.classList.add('on'); openInfo=btn; }
function hideInfo(){ if(!infopop) return; infopop.hidden=true; if(openInfo)openInfo.classList.remove('on'); openInfo=null; }
document.addEventListener('click', function(e){ const b=e.target.closest&&e.target.closest('.info');
  if(b){ e.stopPropagation(); if(openInfo===b){hideInfo();}else{hideInfo();showInfo(b);} return; }
  if(!(e.target.closest&&e.target.closest('#infopop'))) hideInfo(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && openInfo){ hideInfo(); e.stopImmediatePropagation(); } });
window.addEventListener('resize', hideInfo);
window.addEventListener('scroll', hideInfo, true);

$("#meta").textContent = `model ${M.model} · ${M.totalPairs} pairs (${M.validPairs} valid)`;
const card = (k,v,cls,help) => `<div class="card${cls?" "+cls:""}"><div class="k">${k}${help?infoBtn(help):""}</div><div class="v">${v}</div></div>`;
$("#cards").innerHTML =
  card("Pairs", M.totalPairs, "", "pairs") + card("Valid pairs", M.validPairs, "", "pairs") +
  card("Pooled dN/dS", fmt(M.pooled), "hero", "pooled") + card("Mean dN / dS", fmt(M.meanDn,3)+" / "+fmt(M.meanDs,3), "", "meandnds");

// ── Hero verdict banner: plain-language direction of the pooled ratio (mirrors the vcf report).
// This is a pooled point estimate over lineage/group pairs, with no per-ratio significance test,
// so the wording states the direction only and never claims significance.
(function renderVerdict(){
  const v=$("#verdict"); if(!v) return;
  const gw=M.pooled; let lab, dotc;
  if(gw==null||!isFinite(gw)){ lab="dN/dS undetermined"; dotc="var(--ns)"; }
  else if(gw<1){ lab="purifying selection (dN/dS < 1)"; dotc="var(--accent)"; }
  else if(gw>1){ lab="positive / diversifying selection (dN/dS > 1)"; dotc="var(--pos)"; }
  else { lab="neutral (dN/dS = 1)"; dotc="var(--ns)"; }
  const val=(gw==null||!isFinite(gw))?"":fmt(gw,3)+" ";
  v.innerHTML=
    '<span class="dot" style="background:'+dotc+';color:'+dotc+'"></span>'+
    '<div style="flex:1;min-width:0"><div class="vlab">Pooled dN/dS '+val+'— '+lab+'</div>'+
    '<div class="vsub">pooled across '+M.validPairs+' of '+M.totalPairs+' pair(s) · '+hesc(M.model)+' · point estimate</div></div>'+
    infoBtn("pooled");
  v.style.setProperty("--vc", dotc);   // regime colour drives the banner's accent edge + wash
})();

const sec = $("#sections");
function addSection(title, id, help){ const d=document.createElement("section");
  d.innerHTML=`<h2><span class="htitle">${title}</span>${help?infoBtn(help):""}</h2><div style="overflow-x:auto" id="${id}"></div>`;
  sec.appendChild(d); return $("#"+id); }
function wireTip(c){
  c.addEventListener("mousemove", e=>{ const info=e.target.getAttribute && e.target.getAttribute("data-tip");
    if(info){ tip.innerHTML=TIPS[+info]||""; tip.style.opacity=1; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+12)+"px"; } else tip.style.opacity=0; });
  c.addEventListener("mouseleave", ()=>tip.style.opacity=0);
}
function grid(s,ml,pw,mt,ph,ymax,Y,dec){ for(let i=0;i<=5;i++){ const val=ymax*i/5,y=Y(val);
  s.v+=`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/><text x="${ml-8}" y="${y}" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${val.toFixed(dec)}</text>`; } }
function neutral(s,ml,pw,ymax,Y){ if(1<=ymax){ const y=Y(1);
  s.v+=`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="6,3"/><text x="${ml+pw}" y="${y-4}" font-size="10" fill="var(--pos)" text-anchor="end">dN/dS = 1</text>`; } }

// ── Sliding-window dN/dS along the alignment — positional "Manhattan" ──
if (DATA.window) {
  const box = addSection("dN/dS along the alignment (sliding window)", "winplot", "window");
  const w = DATA.window.filter(p=>p[1]!=null && isFinite(p[1]));
  const W=900,H=360,ml=60,mr=30,mt=20,mb=54,pw=W-ml-mr,ph=H-mt-mb;
  const xmax=maxOf(w,1,p=>p[0]), ymax=maxOf(w,1.1,p=>p[1])*1.1;
  const X=p=>ml+p/xmax*pw, Y=v=>mt+ph*(1-v/ymax);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=5;i++){ const val=ymax*i/5,y=Y(val);
    s+=`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/><text x="${ml-8}" y="${y}" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${val.toFixed(2)}</text>`; }
  if(1<=ymax){ const y=Y(1); s+=`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="6,3"/><text x="${ml+pw}" y="${y-4}" font-size="10" fill="var(--pos)" text-anchor="end">dN/dS = 1</text>`; }
  // connecting line + points
  s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="1.5" opacity="0.6" points="${w.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}"/>`;
  w.forEach(p=>{ const col=p[1]>1?"var(--pos)":"var(--accent)";
    s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.4" fill="${col}" ${tipData(`codon ~${p[0]} · dN/dS ${fmt(p[1],3)}`)}/>`; });
  s+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="var(--fg)"/><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="var(--fg)"/>`;
  s+=`<text x="${ml+pw/2}" y="${H-6}" font-size="12" fill="var(--muted)" text-anchor="middle">codon position</text>`;
  s+=`<text x="16" y="${mt+ph/2}" font-size="12" fill="var(--muted)" text-anchor="middle" transform="rotate(-90,16,${mt+ph/2})">mean dN/dS</text></svg>`;
  box.innerHTML=s; wireTip(box);
}

// ── Lineage strip-scatter (points per genome + per-lineage mean) ──
if (DATA.lineage) {
  const box = addSection("dN/dS by lineage — points per genome, bar = mean", "linplot", "lineage");
  const pts = DATA.lineage.filter(d=>d.ratio!=null && isFinite(d.ratio));
  const lins = [...new Set(pts.map(d=>d.lineage))];
  const meanOf={}, nOf={};
  lins.forEach(L=>{ const vs=pts.filter(d=>d.lineage===L).map(d=>d.ratio); nOf[L]=vs.length; meanOf[L]=vs.reduce((a,b)=>a+b,0)/vs.length; });
  const W=Math.max(560, 96*lins.length+140), H=460, ml=60,mr=30,mt=20,mb=110, pw=W-ml-mr, ph=H-mt-mb;
  const ymax=maxOf(pts,1.1,d=>d.ratio)*1.1;
  const X=i=>ml+(i+0.5)/lins.length*pw, Y=v=>mt+ph*(1-v/ymax);
  let seed=97; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff;};
  // Prefer the mycolorsTB lineage color by name (e.g. L1..L10, A1..A4); else a series slot.
  const lkey=L=>{ const t=String(L).toUpperCase().match(/^(A|L)\s*([0-9]{1,2})/); return t?t[1]+t[2]:null; };
  const lc=L=>{ const k=lkey(L); if(k&&MYCOLORS[k]) return MYCOLORS[k]; const i=lins.indexOf(L); return i<8?`var(${SER[i]})`:"var(--ns)"; };
  const s={v:`<svg viewBox="0 0 ${W} ${H}">`};
  grid(s,ml,pw,mt,ph,ymax,Y,2); neutral(s,ml,pw,ymax,Y);
  lins.forEach((L,i)=>{ const cx=X(i), cw=pw/lins.length*0.62;
    pts.filter(d=>d.lineage===L).forEach(d=>{ const jx=cx+(rnd()-0.5)*cw, cy=Y(d.ratio);
      s.v+=`<circle cx="${jx.toFixed(1)}" cy="${cy.toFixed(1)}" r="3.3" fill="${lc(L)}" opacity="0.6" ${tipData(`<b>${hesc(d.genome)}</b><br>${hesc(L)} · dN/dS ${fmt(d.ratio,3)}`)}/>`; });
    const my=Y(meanOf[L]);
    s.v+=`<line x1="${(cx-cw/1.5).toFixed(1)}" y1="${my.toFixed(1)}" x2="${(cx+cw/1.5).toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--fg)" stroke-width="2.6" ${tipData(`<b>${hesc(L)}</b><br>mean ${fmt(meanOf[L],3)} (n=${nOf[L]})`)}/>`;
    s.v+=`<text x="${cx}" y="${mt+ph+14}" font-size="10" fill="var(--muted)" text-anchor="end" transform="rotate(-40,${cx},${mt+ph+14})">${hesc(L)}</text>`; });
  s.v+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="var(--fg)"/><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="var(--fg)"/>`;
  s.v+=`<text x="16" y="${mt+ph/2}" font-size="12" fill="var(--muted)" text-anchor="middle" transform="rotate(-90,16,${mt+ph/2})">dN/dS</text></svg>`;
  box.innerHTML=s.v+`<div class="legend">`+lins.slice(0,8).map(L=>`<span><i style="background:${lc(L)}"></i>${hesc(L)}</span>`).join("")+(lins.length>8?`<span><i style="background:var(--ns)"></i>other</span>`:"")+`</div>`;
  wireTip(box);
}

// ── Group mean ± 95% CI scatter ──
if (DATA.group) {
  const box = addSection("dN/dS by group — mean ± 95% CI", "grpplot", "group");
  const g = DATA.group.filter(d=>d.mean!=null && isFinite(d.mean));
  const W=Math.max(560, 90*g.length+140), H=440, ml=60,mr=30,mt=20,mb=120, pw=W-ml-mr, ph=H-mt-mb;
  const ymax=maxOf(g,1.1,d=>isFinite(d.ciHigh)?d.ciHigh:d.mean)*1.1;
  const X=i=>ml+(i+0.5)/g.length*pw, Y=v=>mt+ph*(1-v/ymax);
  const s={v:`<svg viewBox="0 0 ${W} ${H}">`};
  grid(s,ml,pw,mt,ph,ymax,Y,2); neutral(s,ml,pw,ymax,Y);
  g.forEach((d,i)=>{ const cx=X(i);
    if(isFinite(d.ciLow)&&isFinite(d.ciHigh)){ s.v+=`<line x1="${cx}" y1="${Y(d.ciLow).toFixed(1)}" x2="${cx}" y2="${Y(d.ciHigh).toFixed(1)}" stroke="var(--muted)" stroke-width="1.5"/>`;
      s.v+=`<line x1="${cx-5}" y1="${Y(d.ciHigh).toFixed(1)}" x2="${cx+5}" y2="${Y(d.ciHigh).toFixed(1)}" stroke="var(--muted)"/><line x1="${cx-5}" y1="${Y(d.ciLow).toFixed(1)}" x2="${cx+5}" y2="${Y(d.ciLow).toFixed(1)}" stroke="var(--muted)"/>`; }
    s.v+=`<circle cx="${cx}" cy="${Y(d.mean).toFixed(1)}" r="4.5" fill="var(--accent)" ${tipData(`<b>${hesc(d.label)}</b><br>mean ${fmt(d.mean,3)}<br>95% CI [${fmt(d.ciLow,3)}, ${fmt(d.ciHigh,3)}]`)}/>`;
    s.v+=`<text x="${cx}" y="${mt+ph+14}" font-size="10" fill="var(--muted)" text-anchor="end" transform="rotate(-40,${cx},${mt+ph+14})">${hesc(d.label)}</text>`; });
  s.v+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="var(--fg)"/><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="var(--fg)"/>`;
  s.v+=`<text x="16" y="${mt+ph/2}" font-size="12" fill="var(--muted)" text-anchor="middle" transform="rotate(-90,16,${mt+ph/2})">mean dN/dS</text></svg>`;
  box.innerHTML=s.v; wireTip(box);
}

// ── dN vs dS scatter (one point per pair) ──
if (DATA.dnds) {
  const box = addSection("dN vs dS — one point per pair (above the line = dN>dS)", "dndsplot", "dndsscatter");
  const pts = DATA.dnds.filter(p=>p[0]!=null && p[1]!=null && isFinite(p[0]) && isFinite(p[1]));
  const W=560,H=460,ml=64,mr=24,mt=20,mb=54,pw=W-ml-mr,ph=H-mt-mb;
  const amax=maxOf(pts,0.1,p=>Math.max(p[0],p[1]))*1.08;
  const X=v=>ml+v/amax*pw, Y=v=>mt+ph*(1-v/amax);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=5;i++){ const val=amax*i/5;
    s+=`<line x1="${ml}" y1="${Y(val)}" x2="${ml+pw}" y2="${Y(val)}" stroke="var(--border)" stroke-width="0.5"/><text x="${ml-8}" y="${Y(val)}" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${val.toFixed(2)}</text>`;
    s+=`<text x="${X(val)}" y="${mt+ph+16}" font-size="10" fill="var(--muted)" text-anchor="middle">${val.toFixed(2)}</text>`; }
  // neutral diagonal dN = dS
  s+=`<line x1="${X(0)}" y1="${Y(0)}" x2="${X(amax)}" y2="${Y(amax)}" stroke="var(--pos)" stroke-width="1" stroke-dasharray="6,3"/><text x="${X(amax)-4}" y="${Y(amax)+14}" font-size="10" fill="var(--pos)" text-anchor="end">dN = dS</text>`;
  pts.forEach(p=>{ const col=p[0]>p[1]?"var(--pos)":"var(--accent)";
    s+=`<circle cx="${X(p[1]).toFixed(1)}" cy="${Y(p[0]).toFixed(1)}" r="2.6" fill="${col}" opacity="0.45" ${tipData(`dN ${fmt(p[0],3)} · dS ${fmt(p[1],3)} · dN/dS ${p[1]>0?fmt(p[0]/p[1],3):'∞'}`)}/>`; });
  s+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="var(--fg)"/><line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="var(--fg)"/>`;
  s+=`<text x="${ml+pw/2}" y="${H-6}" font-size="12" fill="var(--muted)" text-anchor="middle">dS</text>`;
  s+=`<text x="16" y="${mt+ph/2}" font-size="12" fill="var(--muted)" text-anchor="middle" transform="rotate(-90,16,${mt+ph/2})">dN</text></svg>`;
  box.innerHTML=s; wireTip(box);
}

// ── Pairwise dN/dS distribution ──
if (DATA.hist) {
  const box = addSection("Pairwise dN/dS distribution", "histplot", "histdist");
  const h=DATA.hist, cmax=maxOf(h,1,d=>d.count);
  const W=760,H=320,ml=60,mr=20,mt=20,mb=70,pw=W-ml-mr,ph=H-mt-mb,bw=pw/h.length;
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=4;i++){ const val=cmax*i/4, y=mt+ph*(1-i/4);
    s+=`<line x1="${ml}" y1="${y}" x2="${ml+pw}" y2="${y}" stroke="var(--border)" stroke-width="0.5"/><text x="${ml-8}" y="${y}" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="middle">${Math.round(val)}</text>`; }
  h.forEach((d,i)=>{ const x=ml+i*bw+3, bh=ph*d.count/cmax, y=mt+ph-bh;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw-6).toFixed(1)}" height="${bh.toFixed(1)}" fill="var(--accent)" opacity="0.8" ${tipData(`<b>${hesc(d.label)}</b><br>${d.count} pairs`)}/>`;
    s+=`<text x="${(x+(bw-6)/2).toFixed(1)}" y="${mt+ph+16}" font-size="9" fill="var(--muted)" text-anchor="middle">${hesc(d.label)}</text>`; });
  s+=`<line x1="${ml}" y1="${mt+ph}" x2="${ml+pw}" y2="${mt+ph}" stroke="var(--fg)"/>`;
  s+=`<text x="${ml+pw/2}" y="${H-6}" font-size="12" fill="var(--muted)" text-anchor="middle">dN/dS bin</text></svg>`;
  box.innerHTML=s; wireTip(box);
}

if(!DATA.lineage && !DATA.group && !DATA.hist && !DATA.dnds && !DATA.window){ sec.innerHTML='<p style="color:var(--muted)">No visualizations available for this run.</p>'; }

// ── Theme toggle · CSV / JSON export · print ──────────────────────────
$("#themeTog").addEventListener("click", ()=>{ const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme", cur==="dark"?"light":"dark"); });

function dl(name,txt,type){ const b=new Blob([txt],{type}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
// Numbers pass through verbatim (full precision, and never a formula); only STRING cells are
// quoted and, if they open with =+-@ (tab/CR), prefixed with ' to defuse spreadsheet formula injection.
const csvCell = v => {
  if(typeof v==="number") return isFinite(v)?String(v):"";
  let s=String(v==null?"":v);
  // Defuse spreadsheet formula injection: =/@ always start a formula; +/- only when more than a
  // lone sign follows (so a bare "+"/"-" datum is left intact, not turned into "'+").
  if(/^[=@\t\r\n]/.test(s) || (s.length>1 && /^[+\-]/.test(s))) s="'"+s;
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
};
const ratio = (dn,ds) => (dn!=null && isFinite(dn) && ds>0) ? dn/ds : "";   // undefined unless dN is estimable and dS>0
// Export the richest labelled table this run carries (lineage > group > per-pair),
// mirroring how the JSON export dumps whatever DATA holds.
function buildCsv(){
  let rows;
  if(DATA.lineage && DATA.lineage.length){
    rows=[["genome","lineage","dN/dS"]];
    DATA.lineage.forEach(d=>rows.push([d.genome, d.lineage, d.ratio]));
  } else if(DATA.group && DATA.group.length){
    rows=[["group","mean_dN/dS","ci_low","ci_high"]];
    DATA.group.forEach(d=>rows.push([d.label, d.mean, d.ciLow, d.ciHigh]));
  } else if(DATA.dnds && DATA.dnds.length){
    rows=[["pair","dN","dS","dN/dS"]];
    DATA.dnds.forEach((p,i)=>rows.push([i+1, p[0], p[1], ratio(p[0],p[1])]));
  } else {
    rows=[["metric","value"],["model",M.model],["pairs",M.totalPairs],["valid_pairs",M.validPairs],
      ["pooled_dN/dS",M.pooled],["mean_dN",M.meanDn],["mean_dS",M.meanDs]];
  }
  return rows.map(r=>r.map(csvCell).join(",")).join("\n");
}
$("#expCsv").addEventListener("click", ()=>dl("eskaks_dnds.csv", buildCsv(), "text/csv"));
$("#expJson").addEventListener("click", ()=>dl("eskaks_dnds.json", JSON.stringify(DATA,null,1), "application/json"));
$("#printBtn").addEventListener("click", ()=>{ hideInfo(); window.print(); });
</script>
</body>
