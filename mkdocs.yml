# MkDocs Material configuration for the eskaks documentation.
# Build:   mkdocs serve         (live preview)
#          mkdocs build --strict (CI gate)
site_name: eskaks
site_description: >-
  Fast pairwise dN/dS and per-gene pN/pS for molecular-evolution and
  Mycobacterium tuberculosis selection analysis.
site_url: https://pathogenomics-lab.github.io/eskaks/
site_author: Paula Ruiz-Rodriguez
copyright: >-
  Copyright &copy; 2026 PathoGenOmics Lab —
  <a href="#__consent">change cookie settings</a>

repo_name: PathoGenOmics-Lab/eskaks
repo_url: https://github.com/PathoGenOmics-Lab/eskaks
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  # The masthead prints the site name in type immediately to the right of this,
  # so the mark beside it is the emblem rather than the wordmark: the wordmark is
  # 2:1 and the theme draws the header logo 24px tall, which is too small to read
  # and says the same thing the type already says. The emblem carries the two
  # chess pieces the wordmark spells its letters with, the red king of the "a"
  # and the blue knight of the "s", lifted straight out of the same vector with
  # their path data untouched. Only their placement differs: in the wordmark they
  # sit 200 units apart with lettering between them, and packing them together
  # is what lets them fill 95% of the square instead of 38%.
  logo: assets/emblem.svg
  # A browser squeezing the 2:1 wordmark into a 16px square produced a smear. The
  # emblem's two colours sit at almost the same luminance by design, so both
  # clear about 3.8:1 on a light tab strip and 4.3:1 on a dark one and the icon
  # needs no dark-ground twin. They are told apart by hue, never by lightness.
  favicon: assets/emblem.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
    admonition:
      note: material/dna
      abstract: material/clipboard-text
      tip: material/lightbulb-on
      warning: material/alert
      danger: material/skull
  palette:
    # Three states rather than two. With only light and dark, the first toggle a
    # reader touches pins the site to that choice forever: there is no third
    # position that hands control back to the machine, so a reader who dims their
    # laptop at sunset has to dim the site by hand as well. The icon names the
    # state you are in; the label names what pressing it does.
    #
    # This entry is first for a second reason: Material stamps the first entry's
    # scheme, primary and accent onto <body> when it renders the page, and its
    # JavaScript only resolves the system preference afterwards. Left to their
    # defaults those three attributes are Material indigo, so every cold load
    # would paint the masthead the wrong blue for one frame.
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light mode (mycolorsTB brand)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Follow the system setting
  # Use the system font stack — no Google Fonts request, so the site contacts no
  # third party for typography (keeps the privacy claim honest).
  font: false
  features:
    # Navigation
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    # navigation.tabs is deliberately NOT enabled, matching get_MNV. It moves the
    # top-level groups into a bar across the header and leaves the sidebar showing
    # only the group you are currently inside. On a site this size that hides most
    # of the map to save nothing: with sections alone, every group and every page
    # under it stays listed down the side, so the whole guide is visible at once.
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Code
    - content.code.copy
    - content.code.annotate
    - content.code.select
    # Content
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
    - announce.dismiss

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  # MathJax is self-hosted (docs/javascripts/mathjax/) rather than pulled from a
  # CDN, matching the font:false decision above. The one remaining third-party
  # fetch is the Mermaid diagramming library, which Material lazy-loads from a CDN
  # only on pages that contain a diagram (currently just vcf-analysis.md). It sets
  # no cookie and runs no analytics; self-hosting mermaid@11 (~3.6 MB + dynamic
  # chunks) is not worth it for one flowchart.
  - javascripts/mathjax/tex-mml-chtml.js

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  # Render the .ipynb tutorial as a native page (with its saved outputs) and a
  # download button. execute:false — outputs are committed with the notebook.
  - mkdocs-jupyter:
      execute: false
      include_source: true
      ignore_h1_titles: true
      theme: auto
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      fallback_to_build_date: true
  # Social cards need cairo/pango, only built in CI (see .github/workflows/docs.yml).
  - social:
      enabled: !ENV [CI, false]
      cards_layout_options:
        background_color: "#305595"

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
      toc_depth: 3
  # PyMdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      # anchor_linenums is deliberately off. No block on this site asks for line
      # numbers, but it still put an empty <a href> in front of every line of
      # code: 248 of them across the built site, 53 on the tutorial page alone.
      # Each is a tab stop with no accessible name and nothing to see when
      # focused, so a keyboard reader paid for anchors to lines that are never
      # numbered and never linked. line_spans stays: the code selection button
      # and code annotations are built on it.
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true

# CI builds with --strict, which promotes every warning to a failure. MkDocs
# already warns about a link to a page that does not exist, but reports a link to
# a heading that does not exist as info, so renaming a section used to break
# every cross-reference to it in silence. Raised to warn, the build catches it
# instead of a reader hitting a dead anchor.
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn

nav:
  - Home: index.md
  - User Guide:
      - Installation: installation.md
      - Getting started (tutorial): tutorial.md
      - Tutorial notebook: tutorial-notebook.ipynb
      - Quick start: quickstart.md
      - Models: models.md
      - Genetic codes: genetic-codes.md
      - Output formats: output-formats.md
      - Interpreting results: interpreting-results.md
      - VCF analysis (pN/pS): vcf-analysis.md
      # One page holds both dashboards, embedded and explained side by side, and
      # the two raw files hang under it: a reader who only wants the dN/dS one
      # should not have to know it is on a page named after the other.
      - Example reports:
          - Both reports (live): example-report.md
          - pN/pS report (raw HTML): assets/example-report.html
          - dN/dS report (raw HTML): assets/example-report-fasta.html
  - Reference:
      - Glossary: glossary.md
      - CLI reference: cli-reference.md
      - Performance & accuracy: performance.md
      - FAQ: faq.md
  - Contributing:
      - Development: development.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/eskaks
      name: eskaks on GitHub
    # In the footer of every page, because the moment someone needs to ask is
    # whichever page they were reading when it stopped answering them. The
    # repository has discussions enabled and this Q&A category exists, so the
    # link lands on a form and not on a 404.
    - icon: material/comment-question-outline
      link: https://github.com/PathoGenOmics-Lab/eskaks/discussions/categories/q-a
      name: Ask a question
  consent:
    title: Cookie consent
    description: >-
      This site uses the browser's local storage only to remember your theme
      choice; it sets no tracking or analytics cookies. Fonts and math rendering
      are self-hosted - the only external request is the Mermaid diagram library,
      loaded from a CDN on pages that contain a diagram.
    actions:
      - accept
      - manage

