<path d="M80.0,420.0 L760.0,256.4 L760.0,420.0 L80.0,420.0 Z" fill="rgba(74,144,217,0.2)" stroke="none"/>
<path d="M80.0,420.0 L760.0,345.7" fill="none" stroke="#2c3e50" stroke-width="2"/>
<line x1="80" y1="50" x2="80" y2="420" stroke="#333333" stroke-width="1.5"/>
