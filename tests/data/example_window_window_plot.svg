<line x1="80" y1="198.0" x2="760" y2="198.0" class="grid"/>
<text x="72" y="198.0" class="tick-label" text-anchor="end" dominant-baseline="middle">0.90</text>
<line x1="80" y1="124.0" x2="760" y2="124.0" class="grid"/>
